name: Bug report
description: Report reproducible incorrect behavior using fictional data only
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach customer projects, credentials, target URLs, or raw evidence.
        Security vulnerabilities must be reported privately through the Security tab.
  - type: input
    id: version
    attributes:
      label: Otter version
      placeholder: 0.1.0b1
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Other
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: 3.10.14
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use the fictional sample project when possible.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: sensitive-data
    attributes:
      label: Data safety
      options:
        - label: I removed all customer information, credentials, targets, and sensitive evidence.
          required: true
        - label: This is not a security vulnerability report.
          required: true
